services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    container_name: car_dealership_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    command:
      - start-dev
      - --import-realm
    ports:
      - "8090:8080"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    networks:
      - app-network
    restart: unless-stopped

  order-db:
    image: postgres:15
    container_name: order_db
    environment:
      POSTGRES_DB: cardealership-orders
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  storage-db:
    image: postgres:15
    container_name: storage_db
    environment:
      POSTGRES_DB: cardealership-storage
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"
    volumes:
      - storage_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  order-service:
    build:
      context: ../order-service/
      dockerfile: docker/Dockerfile
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/cardealership-orders
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8090/realms/car-dealership-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/car-dealership-realm/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STORAGE_SERVICE_URL: http://storage-service:8081
      STORAGE_GRPC_HOST: storage-service
    depends_on:
      - keycloak
      - order-db
      - kafka
    restart: unless-stopped
    networks:
      - app-network

  storage-service:
    build:
      context: ../storage-service/
      dockerfile: docker/Dockerfile
    container_name: storage-service
    ports:
      - "8081:8081"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://storage-db:5432/cardealership-storage
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8090/realms/car-dealership-realm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/car-dealership-realm/protocol/openid-connect/certs
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_SERVICE_URL: http://order-service:8080
      GRPC_SERVER_PORT: 9090
    depends_on:
      - keycloak
      - storage-db
      - kafka
    restart: unless-stopped
    networks:
      - app-network

volumes:
  order_db_data:
  storage_db_data:
  keycloak_data:

networks:
  app-network:
    driver: bridge