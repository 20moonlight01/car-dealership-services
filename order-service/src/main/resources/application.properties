server.port=8080
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/cardealership-orders
spring.datasource.username=admin
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.clientId=car-dealership-api

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/car-dealership-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/car-dealership-realm/protocol/openid-connect/certs

keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=car-dealership-realm
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin-client-id=admin-cli

storage-service.url=${STORAGE_SERVICE_URL:http://localhost:8081}

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.listener.ack-mode=record

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n

grpc.client.storage-service.address=static://${STORAGE_GRPC_HOST:127.0.0.1}:9090
grpc.client.storage-service.negotiation-type=plaintext